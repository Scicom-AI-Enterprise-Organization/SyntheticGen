name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-southeast-5
  ECR_REGISTRY: 865626945255.dkr.ecr.ap-southeast-5.amazonaws.com
  ECR_REPOSITORY: scicom/syntheticgen
  AWS_ROLE_ARN: arn:aws:iam::865626945255:role/Scicom-Syntheticgen-ECRAccessRole

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Compute next version and push tag
  # ──────────────────────────────────────────────────────────────
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      prev_tag: ${{ steps.bump.outputs.prev_tag }}
      major_minor: ${{ steps.bump.outputs.major_minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bump
        run: |
          BUMP="${{ inputs.bump || 'patch' }}"
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT="0.0.0"
          else
            CURRENT=$(echo "$LATEST_TAG" | sed "s/v//")
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${NEXT}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  # ──────────────────────────────────────────────────────────────
  # 2. Build each platform natively and push a platform-tagged image
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.suffix }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.version.outputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  # ──────────────────────────────────────────────────────────────
  # 3. Merge platform images into a single multi-arch manifest
  # ──────────────────────────────────────────────────────────────
  manifest:
    name: Create Multi-Arch Manifest
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create and push multi-arch manifest
        env:
          REGISTRY:    ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY:  ${{ env.ECR_REPOSITORY }}
          VERSION:     ${{ needs.version.outputs.version }}
          MAJOR_MINOR: ${{ needs.version.outputs.major_minor }}
        run: |
          docker buildx imagetools create \
            -t "$REGISTRY/$REPOSITORY:$VERSION" \
            -t "$REGISTRY/$REPOSITORY:$MAJOR_MINOR" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            "$REGISTRY/$REPOSITORY:$VERSION-amd64" \
            "$REGISTRY/$REPOSITORY:$VERSION-arm64"

  # ──────────────────────────────────────────────────────────────
  # 4. Cut the GitHub Release once the manifest is published
  # ──────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [version, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${{ needs.version.outputs.version }}"
          PREV_TAG="${{ needs.version.outputs.prev_tag }}"
          RELEASE_ARGS=("$TAG" --title "v${VERSION}" --generate-notes --latest=false)
          if [ -n "$PREV_TAG" ]; then
            RELEASE_ARGS+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "${RELEASE_ARGS[@]}"
