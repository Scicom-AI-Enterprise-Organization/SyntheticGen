<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!--
    A "sparkle" / 4-pointed star — Heroicons-style sparkle.
    Reads as a generation/AI mark; scales cleanly to 16px because all corners
    are far from the center.
  -->
  <g transform="translate(32 32)">
    <!-- Big primary spark, rotated 0° -->
    <path d="M0 -22 C 2 -8 8 -2 22 0 C 8 2 2 8 0 22 C -2 8 -8 2 -22 0 C -8 -2 -2 -8 0 -22 Z"
          fill="url(#spark)"/>
    <!-- Small secondary spark, top-right -->
    <g transform="translate(15 -15) scale(0.45)">
      <path d="M0 -22 C 2 -8 8 -2 22 0 C 8 2 2 8 0 22 C -2 8 -8 2 -22 0 C -8 -2 -2 -8 0 -22 Z"
            fill="#fde047" opacity="0.95"/>
    </g>
  </g>
</svg>
