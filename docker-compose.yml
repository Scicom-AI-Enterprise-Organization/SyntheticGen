services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  synthgen-api:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: uvicorn synthgen.api.main:app --host 0.0.0.0 --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/enterprise?schema=public
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SYNTHGEN_INTERNAL_TOKEN: ${SYNTHGEN_INTERNAL_TOKEN}
      EXPORTS_DIR: /data/exports
    ports:
      - "8000:8000"
    volumes:
      - exports:/data/exports
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  synthgen-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: python -m synthgen.jobworker.main
    # Reach a provider endpoint running on the Docker host (e.g. a local serverless
    # GPU gateway) at http://host.docker.internal:<port>. The host service must
    # listen on 0.0.0.0, not 127.0.0.1, for this to connect.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/enterprise?schema=public
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SYNTHGEN_INTERNAL_TOKEN: ${SYNTHGEN_INTERNAL_TOKEN}
      EXPORTS_DIR: /data/exports
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    volumes:
      - exports:/data/exports
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/enterprise?schema=public
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SYNTHGEN_API_URL: http://synthgen-api:8000
      SYNTHGEN_INTERNAL_TOKEN: ${SYNTHGEN_INTERNAL_TOKEN}
      EXPORTS_DIR: /data/exports
    volumes:
      - exports:/data/exports
    depends_on:
      db:
        condition: service_healthy
      synthgen-api:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  exports:
